<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Iron & Chalk" />
<meta name="theme-color" content="#DCE1E6" />
<title>Iron &amp; Chalk — Workout Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#E4E8EC; --panel:rgba(255,255,255,.78); --raised:#E5E9EE; --hair:#BAC3CF;
    --chalk:#161B22; --muted:#5B6470; --faint:#6B7585; --onacc:#FFFFFF;
    --brass:#1F2F45; --brassDim:#8E9AAB; --sage:#1F2F45; --coral:#B5683A; --steel:#34496A;
    --disp:'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    --body:'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--ink); }
  body{ font-family:var(--body); color:var(--chalk); }
  #app{ max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh; position:relative; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  input{ font-family:var(--disp); }
  input:focus{ outline:2px solid var(--brass); outline-offset:1px; }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  ::placeholder{ color:var(--faint); opacity:1; }
  .eyebrow{ color:var(--brass); font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
  .h1{ font-family:var(--disp); font-size:34px; font-weight:700; letter-spacing:1px; margin:2px 0 0; line-height:1; }
  .sectionLabel{ color:var(--faint); font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
  .iconBtn{ width:38px; height:38px; border-radius:11px; background:var(--raised); border:1px solid var(--hair);
    display:flex; align-items:center; justify-content:center; color:var(--chalk); }
  .phaseChip{ width:46px; height:46px; border-radius:12px; border:1px solid var(--hair); background:var(--raised);
    color:var(--muted); font-family:var(--disp); font-size:19px; font-weight:600; transition:all .15s; }
  .phaseChip.active{ background:var(--brass); color:var(--onacc); border-color:var(--brass); font-weight:700; }
  .dayCard{ display:flex; align-items:center; justify-content:space-between; width:100%; background:var(--panel);
    border:1px solid var(--hair); border-radius:16px; padding:16px 18px; transition:border-color .15s; text-align:left; color:var(--chalk); }
  .dayCard:active{ border-color:var(--brassDim); }
  .dayNum{ width:44px; height:44px; border-radius:12px; background:var(--ink); border:1px solid var(--hair);
    display:flex; align-items:center; justify-content:center; font-family:var(--disp); font-size:22px; font-weight:700; color:var(--brass); }
  .dayTitle{ font-family:var(--disp); font-size:20px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
  .stickyHead{ position:sticky; top:0; z-index:20; background:rgba(228,232,236,.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hair); padding-top:calc(env(safe-area-inset-top) + 12px); }
  .progTrack{ height:6px; background:var(--raised); border-radius:99px; overflow:hidden; }
  .progFill{ height:100%; background:linear-gradient(90deg,var(--brass),var(--coral)); border-radius:99px; transition:width .3s ease; }
  .finishSm{ background:transparent; border:1px solid var(--brass); color:var(--brass); font-weight:700; font-size:13px; padding:7px 14px; border-radius:10px; }
  .exCard{ background:var(--panel); border:1px solid var(--hair); border-radius:16px; padding:14px 14px 16px; margin-bottom:12px; transition:border-color .2s; }
  .exCard.done{ border-color:var(--brassDim); }
  .exName{ font-family:var(--disp); font-size:17px; font-weight:700; letter-spacing:.3px; }
  .setRow{ display:flex; align-items:center; gap:10px; background:var(--raised); border:1px solid transparent; border-radius:12px; padding:8px 10px; transition:background .15s,border-color .15s; }
  .setRow.done{ background:rgba(31,47,69,.07); border-color:rgba(31,47,69,.35); }
  .setBadge{ width:22px; height:22px; border-radius:7px; background:var(--ink); color:var(--muted); font-family:var(--disp); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .stepper{ display:flex; align-items:center; gap:6px; flex:1; }
  .stepBtn{ width:34px; height:34px; border-radius:9px; background:var(--ink); border:1px solid var(--hair); display:flex; align-items:center; justify-content:center; color:var(--chalk); flex-shrink:0; }
  .weightWrap{ flex:1; display:flex; align-items:baseline; justify-content:center; gap:3px; min-width:0; }
  .weightInput{ width:100%; max-width:62px; background:transparent; border:none; color:var(--chalk); font-size:24px; font-weight:700; text-align:center; padding:0; }
  .unitLbl{ color:var(--faint); font-size:12px; flex-shrink:0; }
  .repsWrap{ display:flex; flex-direction:column; align-items:center; width:40px; flex-shrink:0; }
  .repsInput{ width:40px; background:transparent; border:none; color:var(--muted); font-size:18px; font-weight:600; text-align:center; padding:0; }
  .repsLbl{ color:var(--faint); font-size:10px; margin-top:1px; }
  .doneBtn{ width:40px; height:40px; border-radius:11px; border:1.5px solid var(--hair); background:transparent; display:flex; align-items:center; justify-content:center; color:var(--faint); flex-shrink:0; transition:all .15s; }
  .doneBtn.on{ background:var(--sage); border-color:var(--sage); color:var(--onacc); }
  .cardioCard{ background:var(--panel); border:1px solid var(--hair); border-radius:16px; padding:14px; margin-bottom:12px; }
  .cardioTitle{ font-family:var(--disp); font-size:15px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; }
  .minWrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--raised); border-radius:11px; padding:6px 12px; flex-shrink:0; min-width:66px; }
  .minInput{ width:48px; background:transparent; border:none; color:var(--chalk); font-size:22px; font-weight:700; text-align:center; padding:0; }
  .noteInput{ flex:1; background:var(--raised); border:1px solid var(--hair); border-radius:11px; color:var(--chalk); font-family:var(--body); font-size:16px; padding:0 12px; min-width:0; }
  .finishLg{ width:100%; background:var(--brass); color:var(--onacc); border:none; border-radius:14px; padding:15px; font-family:var(--disp); font-size:17px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin-top:6px; }
  .restPill{ position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--brass); color:var(--onacc); border:none; border-radius:99px; padding:10px 16px; display:flex; align-items:center; gap:8px; font-family:var(--disp); font-size:15px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.4); z-index:40; }
  .histCard{ background:var(--panel); border:1px solid var(--hair); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .statVal{ font-family:var(--disp); font-size:18px; font-weight:700; }
  .statLbl{ color:var(--faint); font-size:10px; text-transform:uppercase; letter-spacing:.6px; margin-top:1px; }
  .setupBox{ background:var(--panel); border:1px solid var(--hair); border-radius:14px; padding:16px; margin-bottom:14px; }
  .field{ width:100%; background:var(--raised); border:1px solid var(--hair); border-radius:11px; color:var(--chalk); font-family:var(--body); font-size:16px; padding:11px 12px; }
  .btnPrimary{ background:var(--brass); color:var(--onacc); border:none; border-radius:11px; padding:11px 14px; font-weight:700; font-size:14px; }
  .btnGhost{ background:transparent; color:var(--chalk); border:1px solid var(--hair); border-radius:11px; padding:11px 14px; font-weight:600; font-size:14px; }
  .codeArea{ width:100%; height:150px; background:#0f1114; border:1px solid var(--hair); border-radius:11px; color:#cdd3dc; font-family:ui-monospace,monospace; font-size:11px; padding:10px; white-space:pre; overflow:auto; }
  .step{ display:flex; gap:10px; margin-bottom:10px; }
  .stepN{ width:22px; height:22px; border-radius:7px; background:var(--brass); color:var(--onacc); font-family:var(--disp); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .toast{ position:fixed; bottom:calc(80px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--raised); color:var(--chalk); border:1px solid var(--hair); border-radius:10px; padding:10px 16px; font-size:13px; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.4); opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show{ opacity:1; }
  .syncDot{ display:inline-block; width:8px; height:8px; border-radius:99px; margin-right:6px; }

  /* ---- Concrete & Navy redesign ---- */
  html,body{ background:linear-gradient(170deg,#DCE1E6 0%,#EBEEF1 40%,#E4E0DA 100%); background-attachment:fixed; }
  body{ min-height:100vh; }
  .h1{ font-weight:800; letter-spacing:-.8px; font-size:30px; line-height:1.1; }
  .eyebrow{ letter-spacing:1.4px; }
  .dayTitle,.cardioTitle{ text-transform:none; letter-spacing:-.3px; font-weight:800; }
  .exName{ font-weight:800; letter-spacing:-.2px; font-size:16px; }
  .dayCard,.exCard,.cardioCard,.histCard,.setupBox{ background:rgba(255,255,255,.78); border:1px solid #fff; border-radius:24px; box-shadow:0 6px 20px rgba(20,30,45,.07); }
  .dayCard:active{ border-color:var(--brassDim); }
  .exCard.done{ border-color:var(--brass); }
  .dayNum{ background:#D0D7E0; border:none; border-radius:14px; color:var(--brass); font-weight:800; }
  .phaseChip{ border-radius:22px; background:rgba(255,255,255,.72); border:1px solid #fff; font-weight:700; height:44px; }
  .iconBtn{ border-radius:22px; width:42px; height:42px; background:rgba(255,255,255,.75); border:1px solid #fff; }
  .setRow{ background:var(--raised); border-radius:20px; }
  .setBadge{ background:#D0D7E0; color:var(--brass); border-radius:50%; width:26px; height:26px; }
  .stepBtn{ background:#fff; border:none; border-radius:50%; }
  .doneBtn{ border-radius:50%; border:2px solid #9EA9B8; }
  .btnPrimary,.btnGhost,.field,.noteInput{ border-radius:22px; }
  .finishSm{ border-radius:22px; }
  .finishLg{ border-radius:28px; letter-spacing:0; text-transform:none; font-size:16px; font-weight:800; }
  .restPill{ box-shadow:0 8px 24px rgba(20,30,45,.25); }
  .progTrack{ background:rgba(255,255,255,.8); height:8px; }
  .progFill{ background:linear-gradient(90deg,#34496A,#B5683A); }
  .minWrap{ border-radius:18px; }
  .toast{ background:#1F2F45; color:#fff; border:none; box-shadow:0 8px 24px rgba(20,30,45,.25); }
  .exThumb{ width:56px; height:56px; flex-shrink:0; border-radius:16px; overflow:hidden; padding:0; border:1px solid #fff; background:#D0D7E0; position:relative; box-shadow:0 2px 8px rgba(20,30,45,.12); }
  .exThumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .exThumb:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  .exThumb span{ position:absolute; right:3px; bottom:3px; font-size:9px; font-weight:800; color:#fff; background:rgba(20,30,45,.72); border-radius:8px; padding:1px 5px; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }
</style>
</head>

/* ===================== EXERCISE LIBRARY ===================== */
/* Base list = every exercise across all phases/days. Custom additions are
   persisted under wl_custom_exercises and merged in. */
const BASE_EXERCISES = (function(){
  const set={};
  Object.keys(PLAN).forEach(function(p){ Object.keys(PLAN[p]).forEach(function(d){
    PLAN[p][d].forEach(function(e){ set[e[0]]=true; }); }); });
  return Object.keys(set);
})();
let customExercises = [];
function exerciseLibrary(){
  const seen={}, out=[];
  BASE_EXERCISES.concat(customExercises).forEach(function(n){
    const k=n.toLowerCase(); if(n && !seen[k]){ seen[k]=1; out.push(n); }
  });
  return out.sort(function(a,b){ return a.toLowerCase()<b.toLowerCase()?-1:1; });
}
function addCustomExercise(name){
  name=(name||"").trim(); if(!name) return "";
  const exists = BASE_EXERCISES.concat(customExercises).some(function(n){ return n.toLowerCase()===name.toLowerCase(); });
  if(!exists){ customExercises.push(name); LS.set("wl_custom_exercises", customExercises); }
  return name;
}
/* rewrites every occurrence of oldName in logged history to newName (case-insensitive
   match), then removes oldName from the custom list and ensures newName is present. */
function mergeExerciseName(oldName, newName){
  newName=(newName||"").trim();
  if(!oldName || !newName) return false;
  let changed=0;
  S.history.forEach(w=>{ (w.exercises||[]).forEach(e=>{
    if(e.name.toLowerCase()===oldName.toLowerCase()){ e.name=newName; changed++; }
  }); });
  if(changed>0) LS.set("wl_history", S.history);
  customExercises = customExercises.filter(n=>n.toLowerCase()!==oldName.toLowerCase());
  if(newName.toLowerCase()!==oldName.toLowerCase()) addCustomExercise(newName);
  else LS.set("wl_custom_exercises", customExercises);
  return true;
}
function deleteCustomExercise(name){
  customExercises = customExercises.filter(n=>n.toLowerCase()!==name.toLowerCase());
  LS.set("wl_custom_exercises", customExercises);
}
/* most recent logged sets for an exercise, across all history (newest first) */
function lastSetsForExercise(name){
  for(const s of S.history){
    const f=(s.exercises||[]).find(function(e){ return e.name===name; });
    if(f && f.sets && f.sets.length) return f.sets.map(function(x){ return {w:x.w, r:x.r}; });
  }
  return null;
}
/* build an <option> list for a select, marking the current value selected */
function libOptions(current){
  const lib=exerciseLibrary();
  if(current && !lib.some(function(n){ return n===current; })) lib.push(current);
  let html="";
  lib.sort(function(a,b){ return a.toLowerCase()<b.toLowerCase()?-1:1; }).forEach(function(n){
    html+=`<option value="${esc(n)}" ${n===current?"selected":""}>${esc(n)}</option>`;
  });
  html+=`<option value="__add__">➕ Add new exercise…</option>`;
  return html;
}

/* ===================== CALORIE ESTIMATE (MET-based) ===================== */
/* Two tiers of accuracy, both clearly labelled as estimates:
   1) ACSM metabolic equations — used when a cardio interval has a speed,
      since speed+incline let us compute real VO2, not a table lookup.
   2) Flat MET values — used for resistance sets and for cardio logged
      without intervals (just minutes). Standard Compendium-of-Physical-
      Activities-style values, not individualised.                       */
const MET_RESISTANCE = 5.0;      // weight training, moderate–vigorous effort
const MET_CARDIO_GENERIC = 5.5;  // unspecified moderate cardio
const RESIST_MIN_PER_SET = 1.5;  // fallback when no session duration is known

function kcalFlat(met, weightKg, minutes){
  if(!weightKg || minutes<=0) return 0;
  return met * weightKg * (minutes/60);
}
function acsmKcalPerMin(speedKmh, inclinePct, weightKg){
  if(!weightKg || speedKmh<=0) return 0;
  const speedM = speedKmh*1000/60;         // m/min
  const grade = (inclinePct||0)/100;       // fraction
  const running = speedKmh >= 6.4;         // ~4mph jog threshold
  const vo2 = running
    ? 0.2*speedM + 0.9*speedM*grade + 3.5
    : 0.1*speedM + 1.8*speedM*grade + 3.5; // ml/kg/min
  return vo2 * weightKg * 0.005;           // 5 kcal / L O2, /1000 mL→L
}
function cardioBlockMinutes(block){
  if(block && block.intervals && block.intervals.length)
    return block.intervals.reduce((s,iv)=>s+(parseFloat(iv.min)||0),0);
  return block ? (parseFloat(block.min)||0) : 0;
}
function cardioBlockKcal(block, weightKg){
  if(!block || !weightKg) return 0;
  if(block.intervals && block.intervals.length){
    return block.intervals.reduce((sum,iv)=>{
      const m=parseFloat(iv.min)||0, sp=parseFloat(iv.speed)||0, inc=parseFloat(iv.incline)||0;
      if(m<=0) return sum;
      return sum + (sp>0 ? acsmKcalPerMin(sp,inc,weightKg)*m : kcalFlat(MET_CARDIO_GENERIC,weightKg,m));
    },0);
  }
  return kcalFlat(MET_CARDIO_GENERIC, weightKg, parseFloat(block.min)||0);
}
/* clean = a finished workout object (post-finishWorkout shape) */
function estimateSessionKcal(clean, weightKg){
  if(!weightKg) return null;
  const blocks=[];
  if(clean.warmup) blocks.push(clean.warmup);
  if(clean.cardio) blocks.push(clean.cardio);
  (clean.cardios||[]).forEach(c=>blocks.push(c));
  let kcal=0, cardioMin=0;
  blocks.forEach(b=>{ kcal+=cardioBlockKcal(b,weightKg); cardioMin+=cardioBlockMinutes(b); });
  let resistMin;
  if(clean.durationMin!=null) resistMin=Math.max(0, clean.durationMin-cardioMin);
  else resistMin=(clean.exercises||[]).reduce((n,e)=>n+e.sets.length,0)*RESIST_MIN_PER_SET;
  kcal += kcalFlat(MET_RESISTANCE, weightKg, resistMin);
  return Math.round(kcal);
}

/* ===================== STORAGE ===================== */
/* Persists via Claude's window.storage when running as an artifact inside
   Claude, and via the browser's localStorage when opened standalone. A
   synchronous in-memory cache fronts the async backend so the rest of the
   app reads/writes without awaiting. */
const Backend = (function(){
  const hasWS = (typeof window!=="undefined") && window.storage && typeof window.storage.get==="function";
  function fire(p){ if(p && typeof p.catch==="function") p.catch(function(){}); }
  return {
    hasWS: hasWS,
    async loadAll(){
      const out={};
      if(hasWS){
        try{
          const res = await window.storage.list("wl_");
          const keys = (res && res.keys) ? res.keys : [];
          for(const k of keys){ try{ const r=await window.storage.get(k); if(r) out[k]=r.value; }catch(e){} }
        }catch(e){}
      } else {
        try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
          if(k && k.indexOf("wl_")===0) out[k]=localStorage.getItem(k); } }catch(e){}
      }
      return out;
    },
    set(k,v){ if(hasWS){ try{ fire(window.storage.set(k,v)); }catch(e){} } else { try{ localStorage.setItem(k,v); }catch(e){} } },
    del(k){ if(hasWS){ try{ fire(window.storage.delete(k)); }catch(e){} } else { try{ localStorage.removeItem(k); }catch(e){} } },
  };
})();

const cache = {};
const LS = {
  get(k, d){ const v=cache[k]; if(v==null) return d; try{ return JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ const s=JSON.stringify(v); cache[k]=s; Backend.set(k,s); },
  raw(k, d){ const v=cache[k]; return v==null? d : v; },
  setRaw(k, v){ cache[k]=v; Backend.set(k,v); },
  del(k){ delete cache[k]; Backend.del(k); },
};

async function postToSheet(payload){
  if(!S.sheetUrl) return false;
  try{
    await fetch(S.sheetUrl,{ method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(payload) });
    return true; // no-cors → opaque; resolution implies request was sent
  }catch(e){ return false; } // network error (e.g. offline)
}
async function syncPending(){
  if(!S.sheetUrl) return;
  const pending = S.history.filter(w=>!w.synced);
  if(pending.length===0) return;
  let ok=0;
  for(const w of pending){
    const done = await postToSheet(workoutPayload(w));
    if(done){ w.synced=true; ok++; }
  }
  if(ok>0){ LS.set("wl_history",S.history); if(S.screen==="settings") render(); }
}
async function resyncAll(){
  if(!S.sheetUrl){ toast("Add your Sheet link first"); return; }
  if(S.history.length===0){ toast("Nothing to sync yet"); return; }
  toast("Syncing "+S.history.length+" workout(s)…");
  const done = await postToSheet(S.history.map(workoutPayload));
  if(done){ S.history.forEach(w=>w.synced=true); LS.set("wl_history",S.history); toast("Synced to Google Sheet"); }
  else toast("Sync failed — check connection");
  render();
}
async function syncCheckins(){
  if(!S.sheetUrl) return;
  const pending=S.checkins.filter(c=>!c.synced);
  if(pending.length===0) return;
  const ok=await postToSheet({ kind:"checkins", items:pending });
  if(ok){ pending.forEach(c=>c.synced=true); LS.set("wl_checkins",S.checkins); }
}

/* ===================== BACKUP EXPORT / IMPORT ===================== */
function exportBackup(){
  const blob = new Blob([JSON.stringify({app:"iron-and-chalk",v:1,history:S.history},null,2)],{type:"application/json"});
  const u=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=u; a.download="workout-backup-"+todayKey()+".json"; a.click(); URL.revokeObjectURL(u);
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result); const inc = Array.isArray(d)? d : d.history;
    if(!Array.isArray(inc)) throw 0;
    const byId={}; [...S.history,...inc].forEach(w=>{ byId[w.id]=w; });
    S.history=Object.values(byId).sort((a,b)=> (a.date<b.date?1:-1));
    LS.set("wl_history",S.history); toast("Imported "+inc.length+" workout(s)"); render(); syncPending();
  }catch(e){ toast("Couldn't read that file"); } };
  r.readAsText(file);
}

/* ---- shared cardio block (simple min+note, or interval-by-interval) ---- */
function syncBlockMin(data){
  if(data.intervals && data.intervals.length)
    data.min = String(data.intervals.reduce((s,iv)=>s+(parseFloat(iv.min)||0),0));
}
function intervalSummary(data){
  const ivs=(data.intervals||[]).filter(iv=>(parseFloat(iv.min)||0)>0);
  if(!ivs.length) return "";
  let totalMin=0, spW=0, incW=0, hasSpeed=false;
  ivs.forEach(iv=>{
    const m=parseFloat(iv.min)||0, sp=parseFloat(iv.speed)||0, inc=parseFloat(iv.incline)||0;
    totalMin+=m; spW+=sp*m; incW+=inc*m; if(sp>0) hasSpeed=true;
  });
  const avgSp=(spW/totalMin).toFixed(1), avgInc=(incW/totalMin).toFixed(1);
  return `${totalMin} min total${hasSpeed?`  ·  avg ${avgSp} km/h`:""}${incW>0?`  ·  avg ${avgInc}% incline`:""}`;
}

        data.intervals.splice(idx,1); syncBlockMin(data); saveDraft();

        else { buildRows(); refreshSummary(); }
      };
      rowsWrap.appendChild(row);
    });
  }
  buildRows();
  el.querySelector("[data-addiv]").onclick=()=>{
    data.intervals.push({min:"",speed:"",incline:""}); saveDraft();
    if(data.intervals.length===1){ const nc=cardioBlockEl(data,cfg); el.replaceWith(nc); updateProgress(); }
    else { buildRows(); refreshSummary(); }
  };
  return el;
}
function cardioEntryEl(it, onRemove){

    placeholder:"e.g. 12% incline · 5.5 / HR 140", nameEditable:true, removable:true, onRemove });

function propagateFirstSet(ex, card){
  const src=ex.sets[0]; if(!src) return;
  for(let i=1;i<ex.sets.length;i++){
    const st=ex.sets[i];
    if(st.af!==false){
      st.w=src.w; st.r=src.r;
      const row=card.querySelector('.setRow[data-set="'+i+'"]');
      if(row){ const w=row.querySelector('.weightInput'), r=row.querySelector('.repsInput');
        if(w) w.value=src.w; if(r) r.value=src.r; }
    }
  }
}

function setRowEl(ex, si, card){
  const st=ex.sets[si];
  const row=document.createElement("div");
  row.className="setRow"+(st.done?" done":""); row.dataset.set=si;
  row.innerHTML=`
    <div class="setBadge">${si+1}</div>
    <div class="stepper">
      <button class="stepBtn" data-bump="-2.5" aria-label="Less">${I.minus}</button>
      <div class="weightWrap"><input class="weightInput" inputmode="decimal" value="${esc(st.w)}" placeholder="0"><span class="unitLbl">${S.session.unit}</span></div>
      <button class="stepBtn" data-bump="2.5" aria-label="More">${I.plus}</button>
    </div>
    <div class="repsWrap"><input class="repsInput" inputmode="numeric" value="${esc(st.r)}" placeholder="—"><span class="repsLbl">reps</span></div>
    <button class="doneBtn ${st.done?"on":""}" data-done aria-label="Mark set done">${I.check}</button>`;
  const wIn=row.querySelector(".weightInput"), rIn=row.querySelector(".repsInput");
  wIn.oninput=()=>{ wIn.value=wIn.value.replace(/[^0-9.]/g,""); st.w=wIn.value;
    if(si===0) propagateFirstSet(ex,card); else st.af=false; saveDraft(); };
  rIn.oninput=()=>{ rIn.value=rIn.value.replace(/[^0-9]/g,""); st.r=rIn.value;
    if(si===0) propagateFirstSet(ex,card); else st.af=false; saveDraft(); };
  row.querySelectorAll("[data-bump]").forEach(b=>b.onclick=()=>{
    const base=parseFloat(st.w||"0")||0;
    const nv=Math.max(0,Math.round((base+parseFloat(b.dataset.bump))*4)/4);
    st.w=String(nv); wIn.value=String(nv);
    if(si===0) propagateFirstSet(ex,card); else st.af=false; saveDraft();
  });
  row.querySelector("[data-done]").onclick=()=>{
    st.done=!st.done;
    row.classList.toggle("done",st.done);
    row.querySelector("[data-done]").classList.toggle("on",st.done);
    card.classList.toggle("done", ex.sets.every(x=>x.done));
    saveDraft(); updateProgress(); startRest();
  };
  return row;
}

/* apply a chosen/added name, prefilling from history where sensible */
function applyExerciseName(ex, name, o){
  ex.name=name;
  const last=lastSetsForExercise(name);
  if(o.swap){
    // keep prescribed set count & target reps; prefill weights from history
    ex.last = last;
    ex.sets = ex.sets.map((st,i)=>({
      w: last&&last[i]!=null? String(last[i].w??"") : "",
      r: last&&last[i]!=null? String(last[i].r??ex.targetReps) : String(ex.targetReps),
      done:false, af:i>0
    }));
  } else {
    // freestyle: adopt last session's shape if available
    if(last && last.length){
      ex.sets = last.map((s,i)=>({ w:String(s.w??""), r:String(s.r??""), done:false, af:i>0 }));
      ex.targetReps = last[0] && last[0].r!=null ? String(last[0].r) : ex.targetReps;
    }
  }
}

function updateProgress(){
  const s=S.session;
  const exArr=[], cardioArr=[];
  if(s.day==="Freestyle" || s.cardioDay){
    s.items.forEach(i=>{ (i.type==="exercise"?exArr:cardioArr).push(i); });
  } else {
    (s.exercises||[]).forEach(e=>exArr.push(e));
    (s.extras||[]).forEach(i=>{ (i.type==="exercise"?exArr:cardioArr).push(i); });
  }
  let total=0, done=0;
  exArr.forEach(e=>{ total+=e.sets.length; done+=e.sets.filter(x=>x.done).length; });
  cardioArr.forEach(c=>{ total+=1; if(Number(c.min)>0) done+=1; });
  const pct= total? Math.round(done/total*100):0;
  const f=document.getElementById("progFill"); if(f) f.style.width=pct+"%";
  const t=document.getElementById("progTxt"); if(t) t.textContent=done+" / "+total;
  const p=document.getElementById("progPct"); if(p) p.textContent=pct+"%";
}

async function finishWorkout(){
  stopRest();
  const s=S.session;
  const durationMin = s.startedAt? Math.max(1,Math.round((Date.now()-s.startedAt)/60000)) : null;
  let clean;
  if(s.day==="Freestyle" || s.cardioDay){
    const exs=s.items.filter(i=>i.type==="exercise")
      .map(e=>({ name:(e.name||"Exercise").trim()||"Exercise", sets:e.sets.filter(x=>x.w!==""||x.done).map(x=>({w:Number(x.w)||0,r:Number(x.r)||0})) }))
      .filter(e=>e.sets.length>0);
    const cardios=s.items.filter(i=>i.type==="cardio")
      .map(c=>({ name:(c.name||"Cardio").trim()||"Cardio", min:c.min, note:c.note, intervals:c.intervals||[] }))
      .filter(c=>c.min!=="" || (c.note&&c.note.trim()!=="") || (c.intervals&&c.intervals.length));
    if(exs.length===0 && cardios.length===0){ toast("Add something before finishing"); return; }
    clean={ id:s.id, phase:s.phase, day:s.day, date:s.date, unit:s.unit, exercises:exs, cardios:cardios, durationMin, synced:false };
    if(s.cardioDay){
      const opt=CARDIO_DAYS[s.day].options[s.option]||CARDIO_DAYS[s.day].options[0];
      clean.cardioOption=opt.name; clean.cardioLog=s.log||{};
    }
  } else {
    const filt=sets=>sets.filter(x=>x.w!==""||x.done).map(x=>({ w:Number(x.w)||0, r:Number(x.r)||0 }));
    const presc=s.exercises.map(e=>({ name:e.name, sets:filt(e.sets) })).filter(e=>e.sets.length>0);
    const extraEx=(s.extras||[]).filter(i=>i.type==="exercise")
      .map(e=>({ name:(e.name||"Exercise").trim()||"Exercise", sets:filt(e.sets) })).filter(e=>e.sets.length>0);
    const extraCardio=(s.extras||[]).filter(i=>i.type==="cardio")
      .map(c=>({ name:(c.name||"Cardio").trim()||"Cardio", min:c.min, note:c.note, intervals:c.intervals||[] }))
      .filter(c=>c.min!=="" || (c.note&&c.note.trim()!=="") || (c.intervals&&c.intervals.length));
    clean={ id:s.id, phase:s.phase, day:s.day, date:s.date, unit:s.unit, warmup:s.warmup, cardio:s.cardio,
      exercises:[...presc,...extraEx], cardios:extraCardio, durationMin, synced:false };
  }
  const wKg = parseFloat(S.bodyweight)||0;
  clean.estKcal = wKg>0 ? estimateSessionKcal(clean, wKg) : null;
  S.history=[clean,...S.history]; LS.set("wl_history",S.history);
  LS.del("wl_draft_"+s.phase+"_"+s.day);
  S.session=null; S.day=null; S.screen="home"; render();
  if(S.sheetUrl){
    const ok=await postToSheet(workoutPayload(clean));
    if(ok){ clean.synced=true; LS.set("wl_history",S.history); toast("Saved · synced to Sheet"); if(S.screen==="home") render(); }
    else toast("Saved locally · will sync when online");
  } else {
    toast("Workout saved on this device");
  }
}

/* ===================== CHARTS (lightweight inline SVG) ===================== */
function lineChartSVG(vals, opts){
  opts=opts||{};
  const w=320,h=110,pad=10;
  const nums=vals.filter(v=>v!=null&&!isNaN(v));
  if(nums.length<2) return `<div style="color:var(--faint);font-size:12px;text-align:center;padding:30px 0">Not enough data yet — need at least 2 points</div>`;
  const min=Math.min(...nums), max=Math.max(...nums), range=(max-min)||1;
  const n=vals.length, stepX=n>1?(w-2*pad)/(n-1):0;
  let path="", dots="";
  vals.forEach((v,i)=>{
    if(v==null||isNaN(v)) return;
    const x=pad+i*stepX, y=h-pad-((v-min)/range)*(h-2*pad);
    path += (path?"L":"M")+x.toFixed(1)+","+y.toFixed(1)+" ";
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${opts.color||HEX.brass}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
    <path d="${path.trim()}" fill="none" stroke="${opts.color||HEX.brass}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function barChartSVG(vals, labels, opts){
  opts=opts||{};
  const w=320,h=110,pad=6,gap=6,labelH=14;
  const n=vals.length;
  if(n===0) return `<div style="color:var(--faint);font-size:12px;text-align:center;padding:30px 0">Not enough data yet</div>`;
  const max=Math.max(1,...vals);
  const bw=(w-2*pad-(n-1)*gap)/n;
  let bars="";
  vals.forEach((v,i)=>{
    const bh=Math.max(2,(v/max)*(h-2*pad-labelH));
    const x=pad+i*(bw+gap), y=h-pad-labelH-bh;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${opts.color||HEX.brass}"/>`;
    if(labels&&labels[i]) bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-2}" font-size="8" fill="${HEX.faint}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">${bars}</svg>`;
}
function isoWeekKey(dateStr){
  const d=new Date(dateStr+"T00:00:00"); const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day); return d.toISOString().slice(0,10);
}
function weekLabel(mondayKey){ return new Date(mondayKey+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
function historyExerciseNames(){
  const set={}; S.history.forEach(s=>(s.exercises||[]).forEach(e=>set[e.name]=true));
  return Object.keys(set).sort((a,b)=>a.toLowerCase()<b.toLowerCase()?-1:1);
}
function liftProgression(name){
  const pts=[];
  [...S.history].reverse().forEach(s=>{
    const e=(s.exercises||[]).find(x=>x.name===name);
    if(e && e.sets.length) pts.push({date:s.date, top:Math.max(...e.sets.map(x=>x.w))});
  });
  return pts.slice(-15);
}

function renderDashboard(root){
  const wKg=parseFloat(S.bodyweight)||0;
  const names=historyExerciseNames();
  if(!dashboardLift || !names.includes(dashboardLift)) dashboardLift = names.length? names[0] : null;
  const totalSessions=S.history.length;
  const weekCount=S.history.filter(s=>daysSince(s.date)<7).length;

  const ci=S.checkins.slice(-12);
  const hrPts=ci.map(c=>c.hr!=null?c.hr:null);
  const hasHr=hrPts.some(v=>v!=null);

  let kcalBox;
  if(wKg>0){
    const byWeek={};
    S.history.forEach(s=>{ const k=isoWeekKey(s.date); const kcal=s.estKcal!=null?s.estKcal:estimateSessionKcal(s,wKg); byWeek[k]=(byWeek[k]||0)+(kcal||0); });
    const weeks=Object.keys(byWeek).sort().slice(-8);

function saveCheckin(weight, hr){
  const w=parseFloat(weight); if(!w || w<=0){ toast("Enter a valid weight"); return false; }
  const today=todayKey();
  const existing=S.checkins.find(c=>c.date===today);
  if(existing){ existing.weight=w; existing.hr=hr?parseFloat(hr):null; existing.synced=false; }
  else S.checkins.push({ id:uid(), date:today, weight:w, hr:hr?parseFloat(hr):null, synced:false });
  S.checkins.sort((a,b)=> a.date<b.date?-1:1);
  S.bodyweight=String(w); LS.setRaw("wl_bodyweight",S.bodyweight);
  LS.set("wl_checkins",S.checkins);
  toast("Check-in saved");
  syncCheckins();
  return true;
}

/* ===================== APPS SCRIPT (shown in Settings) ===================== */
const APPS_SCRIPT = `// Iron & Chalk — workout + check-in sheet endpoint
const SHEET_NAME = 'Workouts';
const HEADERS = ['Logged At','Workout ID','Date','Phase','Day','Focus','Duration (min)','Est Kcal','Type','Exercise','Set','Weight','Unit','Reps','Minutes','Speed','Incline','Note'];
const CHECKIN_SHEET = 'Checkins';
const CHECKIN_HEADERS = ['Logged At','Checkin ID','Date','Weight (kg)','Resting HR'];

function doGet() {
  return ContentService.createTextOutput('Iron & Chalk endpoint is live.');
}

function ensureSheet(ss, name, headers) {
  let sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    sh.appendRow(headers);
    sh.getRange(1,1,1,headers.length).setFontWeight('bold');
    sh.setFrozenRows(1);
  }
  return sh;
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  try {
    lock.waitLock(20000);
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    const data = JSON.parse(e.postData.contents);

    if (data && data.kind === 'checkins') {
      const sh = ensureSheet(ss, CHECKIN_SHEET, CHECKIN_HEADERS);
      const items = data.items || [];
      const ids = items.map(function(c){ return String(c.id); });
      const last = sh.getLastRow();
      if (last > 1) {
        const col = sh.getRange(2,2,last-1,1).getValues();
        for (var r = col.length-1; r >= 0; r--) {
          if (ids.indexOf(String(col[r][0])) !== -1) sh.deleteRow(r+2);
        }
      }
      const now = new Date();
      const rows = items.map(function(c){ return [now, c.id, c.date, c.weight, c.hr || '']; });
      if (rows.length) sh.getRange(sh.getLastRow()+1, 1, rows.length, CHECKIN_HEADERS.length).setValues(rows);
      return ContentService.createTextOutput(JSON.stringify({ok:true, added:rows.length}))
        .setMimeType(ContentService.MimeType.JSON);
    }

    const sh = ensureSheet(ss, SHEET_NAME, HEADERS);
    const workouts = Array.isArray(data) ? data : [data];
    const ids = workouts.map(function(w){ return String(w.id); });

    const last = sh.getLastRow();
    if (last > 1) {
      const col = sh.getRange(2,2,last-1,1).getValues();
      for (var r = col.length-1; r >= 0; r--) {
        if (ids.indexOf(String(col[r][0])) !== -1) sh.deleteRow(r+2);
      }
    }

    const now = new Date();
    const rows = [];
    function cardioRows(base, label, block) {
      if (!block) return;
      if (block.intervals && block.intervals.length) {
        block.intervals.forEach(function(iv, i) {
          rows.push(base.concat(['interval', label, i+1, '', '', '', iv.min||'', iv.speed||'', iv.incline||'', '']));
        });
        if (block.note) rows.push(base.concat(['cardio-note', label, '', '', '', '', '', '', '', block.note]));
      } else if (block.min || block.note) {
        rows.push(base.concat(['cardio', label, '', '', '', '', block.min||'', '', '', block.note||'']));
      }
    }
    workouts.forEach(function(w){
      const base = [now, w.id, w.date, w.phase, w.day, w.focus || '', w.durationMin || '', w.estKcal || ''];
      cardioRows(base, 'Warm-up', w.warmup);
      (w.exercises||[]).forEach(function(ex){
        (ex.sets||[]).forEach(function(s,i){
          rows.push(base.concat(['set', ex.name, i+1, s.w, w.unit, s.r, '', '', '', '']));
        });
      });
      (w.cardios||[]).forEach(function(c){ cardioRows(base, c.name||'Cardio', c); });
      cardioRows(base, 'Steady-state', w.cardio);
    });
    if (rows.length) sh.getRange(sh.getLastRow()+1, 1, rows.length, HEADERS.length).setValues(rows);

    return ContentService.createTextOutput(JSON.stringify({ok:true, added:rows.length}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ok:false, error:String(err)}))
      .setMimeType(ContentService.MimeType.JSON);
  } finally {
    try { lock.releaseLock(); } catch (e2) {}
  }
}`;

/* ===================== BOOT ===================== */
async function boot(){
  const all = await Backend.loadAll();
  Object.keys(all).forEach(function(k){ cache[k]=all[k]; });
  S.phase      = LS.get("wl_phase", 1);
  S.history    = LS.get("wl_history", []);
  S.unit       = LS.raw("wl_unit","kg");
  S.sheetUrl   = LS.raw("wl_sheet_url","");
  S.bodyweight = LS.raw("wl_bodyweight","");
  S.checkins   = LS.get("wl_checkins", []);
  customExercises = LS.get("wl_custom_exercises", []);
  render();
  syncPending();
  syncCheckins();
}
window.addEventListener("online", ()=>{ syncPending(); syncCheckins(); });
boot();
</script>
